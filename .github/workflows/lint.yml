name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Prefixed per workflow. A group shared with the other workflows would make
# them cancel each other on the same ref and only one check would finish.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --legacy-peer-deps

      - run: npm run lint
